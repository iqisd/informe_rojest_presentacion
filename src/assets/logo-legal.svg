<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Legal framework icon -->
  <defs>
    <linearGradient id="legalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(100, 100)">
    <!-- Law book -->
    <rect x="-40" y="-45" width="80" height="70" rx="5" fill="url(#legalGradient)" stroke="#6D28D9" stroke-width="2"/>
    
    <!-- Book spine -->
    <line x1="-30" y1="-45" x2="-30" y2="25" stroke="#6D28D9" stroke-width="2"/>
    
    <!-- Pages/lines -->
    <line x1="-20" y1="-30" x2="30" y2="-30" stroke="white" stroke-width="2.5"/>
    <line x1="-20" y1="-15" x2="30" y2="-15" stroke="white" stroke-width="1.5"/>
    <line x1="-20" y1="-5" x2="30" y2="-5" stroke="white" stroke-width="1.5"/>
    <line x1="-20" y1="5" x2="30" y2="5" stroke="white" stroke-width="1.5"/>
    <line x1="-20" y1="15" x2="30" y2="15" stroke="white" stroke-width="1.5"/>
    
    <!-- Scale symbol -->
    <g transform="translate(40, 15)">
      <line x1="0" y1="-8" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
      <circle cx="-6" cy="8" r="3" fill="white"/>
      <circle cx="6" cy="8" r="3" fill="white"/>
    </g>
    
    <!-- Text -->
    <text x="0" y="65" font-size="12" font-weight="bold" text-anchor="middle" fill="#6D28D9">LEGAL</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Personal data icon -->
  <defs>
    <linearGradient id="datosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(100, 100)">
    <!-- Database cylinder -->
    <ellipse cx="0" cy="-20" rx="35" ry="15" fill="url(#datosGradient)" stroke="#0891B2" stroke-width="2"/>
    <rect x="-35" y="-20" width="70" height="50" fill="url(#datosGradient)"/>
    <ellipse cx="0" cy="30" rx="35" ry="15" fill="#0891B2" stroke="#0891B2" stroke-width="2"/>
    
    <!-- Data lines -->
    <line x1="-25" y1="-5" x2="25" y2="-5" stroke="white" stroke-width="2"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="white" stroke-width="2"/>
    <line x1="-25" y1="15" x2="25" y2="15" stroke="white" stroke-width="2"/>
    
    <!-- Lock indicator -->
    <circle cx="35" cy="-5" r="12" fill="white" stroke="#0891B2" stroke-width="2"/>
    <rect x="30" y="2" width="10" height="6" rx="1" fill="#0891B2"/>
    
    <!-- Text -->
    <text x="0" y="65" font-size="12" font-weight="bold" text-anchor="middle" fill="#0891B2">DATOS</text>
  </g>
</svg>
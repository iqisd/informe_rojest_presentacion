<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Shield with lock -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(100, 100)">
    <!-- Outer shield -->
    <path d="M 0,-80 L 60,-50 L 60,20 Q 0,70 0,70 Q 0,70 -60,20 L -60,-50 Z" fill="url(#shieldGradient)" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Inner lock circle -->
    <circle cx="0" cy="5" r="25" fill="white" opacity="0.95"/>
    
    <!-- Lock shape -->
    <rect x="-12" y="0" width="24" height="20" rx="3" fill="#3B82F6"/>
    <circle cx="0" cy="-5" r="10" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="-5" r="3" fill="#3B82F6"/>
    
    <!-- Text at bottom -->
    <text x="0" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#1E40AF">GTD</text>
  </g>
</svg>